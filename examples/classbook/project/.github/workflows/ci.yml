# NOTE: written without the ability to run it (no GitHub in the build environment). Verify on first push.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint-level check (syntax)
        run: python -m compileall -q classbook tests
      - name: Tests
        run: python -m pytest
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t classbook:ci .
      - name: Container starts and answers /health
        run: |
          docker run -d --name cb -p 8000:8000 \
            -e APP_ENV=development -e DATABASE_PATH=/tmp/c.db \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-only-password-1234 classbook:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs cb; exit 1
