{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  {{ csrf_field() }}
  <input type="hidden" name="next" value="{{ next }}">
  <p><label for="email">Email</label><br><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" value="{{ email }}"></p>
  <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></p>
  <p><button type="submit">Sign in</button></p>
</form>
<p>New here? <a href="/signup">Create an account</a></p>
{% endblock %}
