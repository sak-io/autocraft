name: classbook
on:
  pull_request:
    paths: ["examples/classbook/**", ".github/workflows/classbook.yml"]
  push:
    branches: [main]
    paths: ["examples/classbook/**", ".github/workflows/classbook.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/classbook/project
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: "examples/classbook/project/requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: pytest -o addopts="" -q
      - run: pip-audit -r requirements.txt
