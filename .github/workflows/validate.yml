name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml shellcheck-py
      - run: bash scripts/validate.sh
      - run: shellcheck -S warning scripts/*.sh
