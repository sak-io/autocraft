# Tunable knobs for your agent team. See docs/protocol.md.
autonomy_level: 2          # 1 = approve every phase, 2 = approve architecture + merges, 3 = approve merges only
max_review_rounds: 3       # review loops before escalating to a human
max_parallel_developers: 3 # developer agents at once (independent tasks only)
default_branch: main
archetypes: []             # api-service | web-app | mobile-app | scheduled-job | library-cli (one or more)
language: ""               # node | python | go | flutter (set by onboarding)
human_owner: ""            # GitHub handle to notify when something is release-ready
